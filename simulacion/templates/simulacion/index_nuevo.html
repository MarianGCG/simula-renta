<div class="container">

  <!-- 🔥 HEADER -->

  <!-- 🔵 ----------------------------------------------------------TAB CAPITAL -->
  <div id="tab-capital" class="tab-content active">

    <div class="filtros-wrapper">
    <div class="bloque filtros-capital">

      <div class="fila" style="display:grid; grid-template-columns: auto 1fr auto; align-items:center; padding:18px 30px;">

        <div class="filtro-card">
          <div style="margin-left:40px;width:100px;">
            <label>Frecuencia y Moneda</label>
            <select id="frecuencia2" onchange="setFrecuencia(this.value)">
              <option value="anual">Anual</option>
              <option value="mensual" selected>Mensual</option> <!-- 🔥 -->
            </select>
          </div>
        

          <div class="btn-group">
            <button id="btn-usd" onclick="setMoneda('USD')">USD</button>
            <button id="btn-ars" onclick="setMoneda('ARS')">$</button>

            <input type="number" id="monto2" value="2000" style="width:80px;">
          </div>

            <label style="margin:0;">Años</label>
            <input type="number" id="anios2-input" value="25" style="width:50px;">
          </div>
        </div>

<script>
let modoActivo = "manual"; // "manual" o "combo"
let calculando = false;
let frecuenciaSeleccionada = "mensual"; // 🔥 default
let resultadosActuales = [];
let monedaSeleccionada = "USD";

function setMoneda(m){

  monedaSeleccionada = m;

  const btnUsd = document.getElementById("btn-usd");
  const btnArs = document.getElementById("btn-ars");

  if(btnUsd && btnArs){
    btnUsd.classList.toggle("active", m === "USD");
    btnArs.classList.toggle("active", m === "ARS");
  }

  actualizarLabelsMoneda();   // 🔥 NUEVO
  calcularCapital();
}
function setFrecuencia(f){
  frecuenciaSeleccionada = f;
  calcularCapital();
}

function actualizarLabelsMoneda(){

  const simbolo = monedaSeleccionada === "USD" ? "US$" : "$";

  // ejemplo: podés actualizar placeholders o textos si querés
  const labelMonto = document.getElementById("label-monto");
  if(labelMonto){
    labelMonto.textContent = labelMonto.textContent.replace(/US\$|\$/g, simbolo);
  }
}

// CSRF (importante para Django)
function getCsrfToken() {
  return document.cookie.split(';')
    .map(c => c.trim())
    .find(c => c.startsWith('csrftoken='))
    ?.split('=')[1] || '';
}

function fmt(n){
  return '$' + Math.round(n).toLocaleString('es-AR');
}

async function calcular(){

  calculando = true;

  const escenarios = [];



  document.querySelectorAll('.escenario-row').forEach(row => {

  const capital = row.querySelector('.sc-capital')?.value;
  const anios = row.querySelector('.sc-anios')?.value;

  if (capital && anios) {
      escenarios.push({
      capital: parseFloat(capital),
      anios: parseInt(anios)
      });
  }

  });




  try {
    const resp = await fetch('/calcular/',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'X-CSRFToken': getCsrfToken()
      },
      body: JSON.stringify({
        tasa_anual:0.05,
        perfil:'Moderado',
        escenarios
      })
    });

    const data = await resp.json();
    resultadosActuales = data.escenarios;

    data.escenarios.forEach((esc, idx)=>{
      const container = document.getElementById(`res-${idx+1}`);

      container.style.display = 'flex';
      setTimeout(() => container.style.opacity = '1', 50);



      container.innerHTML = `

      <div style="text-align:center; width:100%;">

        <div style="font-size:14px;opacity:.8">
          Capital necesario
        </div>

        <div style="font-size:36px;font-weight:700; margin:6px 0;">
          ${fmt(esc.capital)}
        </div>

        <div style="font-size:14px;opacity:.8">
          durante ${esc.anios} años
        </div>

        <div style="margin-top:10px;font-size:13px;opacity:.9">
          Retiro mensual ${fmt(esc.retiro_mensual)}
        </div>

        <button class="toggle-tabla" onclick='abrirPanelDesdeIndice(${idx})'>
          ▶ Ver detalle años
        </button>

      </div>


      <!-- TABLA -->
      <div class="tabla-wrap" id="tabla-${idx}">
        <table>
          <thead>
            <tr>
              <th>Año</th>
              <th>Capital inicio</th>
              <th>Interés</th>
              <th>Retiro anual</th>
              <th>Capital fin</th>
            </tr>
          </thead>
          <tbody>
            ${esc.tabla.map(row => `
              <tr>
                <td>${row.anio}</td>
                <td class="${row.capital_inicio < 0 ? 'negative' : ''}">${fmt(row.capital_inicio)}</td>
                <td class="${row.interes < 0 ? 'negative' : ''}">${fmt(row.interes)}</td>
                <td>${fmt(row.retiro_anual)}</td>
                <td class="${row.capital_fin < 0 ? 'negative' : ''}">${fmt(row.capital_fin)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      `;




    });

    document.querySelector('.btn-print').style.display = 'flex';
    calculando = false;
    
  } catch (e) {
    alert('Error al calcular');
    console.error(e);
  }

  
}

      if(e.shiftKey){

        siguiente = index === 0 
          ? inputsOrdenados.length - 1 
          : index - 1;
      } else {
        // TAB normal (hacia adelante)

      }

      inputsOrdenados[siguiente].focus();
    }

  });

});

function calcularCapitalInterno(monto, tasaAnual, anio, frecuencia){

  let r, n;

  if(frecuencia === "mensual"){
    r = tasaAnual / 12;
    n = anio * 12;
  }else{
    r = tasaAnual;
    n = anio;
  }

  if(r === 0){
    return monto * n;
  }

  return monto * (1 - Math.pow(1 + r, -n)) / r;
}

function generarTablaCapital(capitalInicial, retiro, tasa, anios, frecuencia){
  
  console.log("DETALLE → frecuencia:", frecuencia);
  console.log("DETALLE → retiro:", retiro);

  let capital = capitalInicial;

  let html = `
    <table>
      <thead>
        <tr>
          <th>Año</th>
          <th>Capital inicio</th>
          <th>Interés</th>
          <th>Retiro</th>
          <th>Capital fin</th>
        </tr>
      </thead>
      <tbody>
  `;

  for(let i=1; i<=anios; i++){

    const interes = capital * tasa;

    let retiroPeriodo;

    if(frecuencia && frecuencia.toLowerCase().trim() === "mensual"){
      retiroPeriodo = retiro * 12;
    }else{
      retiroPeriodo = retiro;
    }

    const capitalFin = capital + interes - retiroPeriodo;

    html += `
      <tr class="${capitalFin < 0 ? 'negative-row' : ''}">
        <td>${i}</td>
        <td>$${Math.round(capital).toLocaleString('es-AR')}</td>
        <td>$${Math.round(interes).toLocaleString('es-AR')}</td>
        <td>$${Math.round(retiroPeriodo).toLocaleString('es-AR')}</td>
        <td class="${capitalFin < 0 ? 'negative' : ''}">
          $${Math.round(capitalFin).toLocaleString('es-AR')}
        </td>
      </tr>
    `;

    capital = capitalFin;
  }

  html += "</tbody></table>";

  document.getElementById("tabla-capital").innerHTML = html;
}


function mostrarDetalle(capital, retiro, tasa, anios, frecuencia){
  generarTablaCapital(capital, retiro, tasa, anios, frecuencia);
}

function generarSerieCapital(capitalInicial, retiroMensual, tasa, anios){

  let capital = capitalInicial;
  const datos = [];
  const labels = [];

  for(let i=0; i<=anios; i++){

    labels.push(i === 0 ? "Inicio" : "Año " + i);
    datos.push(Math.max(0, capital));

    const interes = capital * tasa;
    const retiro = retiroMensual * 12;

    capital = capital + interes - retiro;
  }

  return {labels, datos};
}
